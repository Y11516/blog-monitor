<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级靶场进度监控矩阵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0e17; /* 深色背景 */
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 60px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { width: 100%; max-width: 1200px; margin-bottom: 40px; text-align: center; }
        .header h1 { font-size: 1.8rem; font-weight: 600; color: #00f0ff; margin-bottom: 8px; letter-spacing: 2px;}
        .header p { color: #6b7280; font-size: 0.9rem; }

        /* 表格容器，处理横向滚动 */
        .table-container {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            background: #111520;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        /* 表头样式 */
        thead th {
            background-color: #1a1f2e;
            color: #00f0ff;
            padding: 18px 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* 第一列（姓名）特殊样式，固定在左侧 */
        thead th:first-child, tbody td:first-child {
            position: sticky;
            left: 0;
            background-color: #151b28;
            color: #ffffff;
            font-weight: 500;
            border-right: 2px solid rgba(0, 240, 255, 0.15);
            z-index: 10;
        }
        thead th:first-child {
            z-index: 11;
            background-color: #1a1f2e;
        }

        /* 数据行样式 */
        tbody td {
            padding: 16px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
        }

        /* 鼠标悬浮行高亮 */
        tbody tr:hover td {
            background-color: rgba(0, 240, 255, 0.04);
        }
        tbody tr:hover td:first-child {
            background-color: #1c2538;
            color: #00f0ff;
        }

        /* 数字为 0 时的弱化显示 */
        .count-zero { color: #4b5563; }
        /* 有数据时的强调显示 */
        .count-data { color: #64ffda; font-weight: bold; text-shadow: 0 0 10px rgba(100, 255, 218, 0.3); }

    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ 靶场进度监控矩阵</h1>
        <p id="last-update">正在加载数据...</p>
    </div>

    <div class="table-container">
        <table id="matrix-table">
            <thead>
                <tr id="table-head">
                    <!-- 表头由 JS 动态生成 -->
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- 数据由 JS 动态生成 -->
            </tbody>
        </table>
    </div>

    <script>
        async function loadMatrix() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                const headRow = document.getElementById('table-head');
                const tbody = document.getElementById('table-body');
                
                // 1. 渲染表头：姓名 + 各个靶场
                let headHTML = '<th>姓名 / 靶场</th>';
                data.labs.forEach(lab => {
                    headHTML += `<th>${lab}</th>`;
                });
                headRow.innerHTML = headHTML;

                // 2. 渲染数据行
                data.students.forEach(student => {
                    let rowHTML = `<tr><td>${student.name}</td>`;
                    data.labs.forEach(lab => {
                        const count = student.counts[lab] || 0;
                        // 根据数量给数字加样式
                        if (count > 0) {
                            rowHTML += `<td class="count-data">${count}</td>`;
                        } else {
                            rowHTML += `<td class="count-zero">0</td>`;
                        }
                    });
                    rowHTML += '</tr>';
                    tbody.innerHTML += rowHTML;
                });

                // 更新底部时间
                document.getElementById('last-update').textContent = `最后更新: ${data.last_updated}`;
                
            } catch (error) {
                console.error("加载数据失败:", error);
                document.getElementById('last-update').textContent = '数据加载失败，请检查 data.json';
            }
        }
        
        loadMatrix();
    </script>
</body>
</html>
